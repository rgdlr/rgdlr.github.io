<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi prueba</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .card {
      padding: 40px;
      text-align: center;
      background: rgba(255,255,255,.15);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    h1 { margin-bottom: 10px; }
    p { opacity: .85; }
  </style>
</head>
<body>

  <div class="card">
    <h1>¡Hola! 👋</h1>
    <p>Esto es una página de prueba.</p>
  </div>

</body>
</html>
